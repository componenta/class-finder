name: Discovery dependency integration

on:
  push:
    branches: ['fix/deep-audit-2026-11-25']
  workflow_dispatch:

jobs:
  integration:
    name: PHP ${{ matrix.php }} (audited dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: componenta/tokenizer
          ref: f8d267055ec5ebb33d125da280091b9629fb080e
          path: .audit-deps/tokenizer
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: componenta/iterator
          ref: 2c444d7fa46ab1472968a1976d77676367f9e0b7
          path: .audit-deps/iterator
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install exact audited sources through path repositories
        shell: bash
        run: |
          composer config repositories.audit-tokenizer '{"type":"path","url":".audit-deps/tokenizer","options":{"symlink":false,"versions":{"componenta/tokenizer":"1.0.1"}}}'
          composer config repositories.audit-iterator '{"type":"path","url":".audit-deps/iterator","options":{"symlink":false,"versions":{"componenta/iterator":"1.1.2"}}}'
          composer update --no-interaction --prefer-dist
          php -r '$lock = json_decode(file_get_contents("composer.lock"), true, flags: JSON_THROW_ON_ERROR); $paths = ["componenta/tokenizer" => ".audit-deps/tokenizer", "componenta/iterator" => ".audit-deps/iterator"]; foreach ($lock["packages"] as $package) { if (isset($paths[$package["name"]]) && ($package["dist"]["type"] ?? null) === "path" && $package["dist"]["url"] === $paths[$package["name"]]) { unset($paths[$package["name"]]); } } if ($paths !== []) { throw new RuntimeException("Audited path packages not installed: " . implode(", ", array_keys($paths))); }'
          cmp .audit-deps/tokenizer/src/Tokenizer.php vendor/componenta/tokenizer/src/Tokenizer.php
          cmp .audit-deps/tokenizer/src/ClassInfo.php vendor/componenta/tokenizer/src/ClassInfo.php
          cmp .audit-deps/iterator/src/ReplayableIterator.php vendor/componenta/iterator/src/ReplayableIterator.php
      - name: Verify cross-package discovery behavior
        run: php tests/integration/audited-dependencies.php
      - run: composer test
      - run: vendor/bin/pest --reverse-order

      - name: Benchmark audited dependencies
        if: matrix.php == '8.5'
        shell: bash
        run: |
          set -o pipefail
          vendor/bin/phpbench run --iterations=3 --report=aggregate 2>&1 | tee "$RUNNER_TEMP/audited-bench.log"
          grep -Eq 'Subjects: [1-9][0-9]*,' "$RUNNER_TEMP/audited-bench.log"
          for suite in DiscoveryBench PredicateBench ListenerBench; do
            grep -Fq "$suite" "$RUNNER_TEMP/audited-bench.log"
          done
